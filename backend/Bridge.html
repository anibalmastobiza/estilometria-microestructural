<!doctype html><html><head><base target="_top"><meta charset="utf-8"></head><body>
<script>
const ALLOWED_ORIGIN = <?!= JSON.stringify(origin).replace(/</g,'\\u003c') ?>;
const CHANNEL = <?!= JSON.stringify(channel) ?>;
window.addEventListener('message',e=>{
 if(e.origin!==ALLOWED_ORIGIN||e.source!==window.top||e.data?.channel!==CHANNEL||!['eme-save','eme-check'].includes(e.data?.type))return;
 const requestId=e.data.requestId;
 if(typeof requestId!=='string'||requestId.length>80)return;
 const runner=google.script.run.withSuccessHandler(result=>{
  window.top.postMessage({type:'eme-saved',channel:CHANNEL,requestId,ok:result.ok,open:result.open},ALLOWED_ORIGIN);
 }).withFailureHandler(()=>{
  window.top.postMessage({type:'eme-saved',channel:CHANNEL,requestId,ok:false,error:'No se ha podido guardar. Comprueba la configuración del receptor.'},ALLOWED_ORIGIN);
 });
 if(e.data.type==='eme-check')runner.checkConnection();else runner.saveSession(e.data.payload);
});
if(CHANNEL&&/^https:\/\//.test(ALLOWED_ORIGIN))window.top.postMessage({type:'eme-ready',channel:CHANNEL},ALLOWED_ORIGIN);
</script></body></html>
